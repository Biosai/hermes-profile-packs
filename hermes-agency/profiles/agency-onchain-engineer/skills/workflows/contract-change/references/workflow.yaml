name: contract-change
version: 0.1.0
description: "Change a smart contract through review and testnet"
summary: >-
  A smart-contract change goes from failing-first tests to an owner-approved mainnet action, with
  review by profiles that did not write it and a testnet deployment in between.
pack: agency
coordinator: agency-onchain-engineer
trigger: >-
  Any change to contract source, deployment or upgrade scripts, access control, fees, supply,
  allowances, or configuration a deployed contract reads.
uses_settings: [delivery.code_host, delivery.merge_policy, owner.channel, owner.action_tracker]
steps:
  - id: change
    profile: agency-onchain-engineer
    skills: [contract-change-authoring]
    does: Write the intent and invariants, the failing-first tests, then the change, in a draft request.
    output: a draft request with intent, invariants and test evidence
  - id: review
    profile: agency-code-reviewer
    skills: [code-review, test-adequacy-review]
    needs: [change]
    on_fail: change
    does: Review the change and whether its tests would catch a broken invariant.
    output: findings resolved, or the blocking ones
  - id: security
    profile: agency-security-reviewer
    skills: [security-review, authorization-review]
    needs: [change]
    optional_when: the change touches funds, access control, upgradeability or external calls
    on_fail: change
    does: Review the change for loss of funds, privilege and upgrade risks.
    output: findings resolved, or the blocking ones
  - id: testnet
    profile: agency-onchain-engineer
    skills: [testnet-deployment]
    needs: [review, security]
    does: Deploy to a testnet and verify the behaviour on-chain.
    output: testnet addresses, transactions and verification
  - id: mainnet
    human: true
    decided_by: owner
    needs: [testnet]
    asks: approve and sign the prepared mainnet action, or say what blocks it
    does: The owner decides on mainnet and signs. Each mainnet action is an owner action.
    output: the owner's decision and, if approved, the mainnet transaction
done_when:
  - Mainnet changes only through an action the owner approved and signed.
