name: email-send-with-approval
version: 0.2.0
description: "Draft, check, approve and send an email campaign"
summary: >-
  An email campaign is sent only after deliverability is checked and the owner approved the exact
  campaign and audience. Drafts are free; the send is gated.
pack: agency
coordinator: agency-email-marketer
trigger: >-
  A campaign is needed: a launch, a newsletter slot, or a lifecycle message.
uses_settings: [project.brief, publishing.approval, owner.channel]
max_fix_rounds: 3
steps:
  - id: draft
    profile: agency-email-marketer
    skills: [email-campaign, approval-gated-publishing]
    extra_skills:
      - {skill: segmentation, when: "the audience is a segment, not the whole list"}
    does: >-
      Draft the campaign and pick the audience from the project brief, with each recipient's
      consent basis. An imported "subscribed" status needs the owner's dated opt-in statement.
    output: subject, body, audience, consent basis and send time, as a draft in the email platform
  - id: deliverability
    profile: agency-email-marketer
    skills: [deliverability-review]
    needs: [draft]
    on_fail: draft
    does: Check authentication, links, list hygiene and spam risk before anyone approves.
    output: a deliverability check that passes, or what to fix
  - id: approve
    human: true
    decided_by: owner
    needs: [deliverability]
    on_reject: draft
    asks: approve this exact campaign, audience and send time, or say what to change
    does: >-
      The owner approves the exact campaign and audience, captured the way `publishing.approval` says.
    output: the owner's approval, recorded verbatim
  - id: send
    profile: agency-email-marketer
    skills: [approval-gated-publishing]
    needs: [approve]
    does: >-
      Schedule or send exactly the approved campaign to the approved audience, then read each
      message back and compare its status and send time with the approved ones. An unexpected
      error on a send call goes to the owner, not to a retry on another endpoint.
    output: the sent or scheduled campaign, linked, with its read-back send time
done_when:
  - The sent campaign and audience match the approved ones exactly.
