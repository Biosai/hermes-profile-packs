name: after-merge
version: 0.1.0
description: "Close the loop after a change merges"
summary: >-
  Everything that must happen once a change has merged, done by the profile that owns each part:
  the developer's clean-up and counterpart, the knowledge base and shared skills, and closing the
  work item against its acceptance criteria.
pack: agency
coordinator: agency-product-manager
trigger: >-
  A pull or merge request that belongs to a work item has merged (for a multi-repo item: every PR of it).
uses_settings: [delivery.code_host, delivery.issue_tracker, owner.channel]
all_steps_load: [gated-delivery]
steps:
  - id: followups
    profile: agency-backend-engineer
    skills: [merge-followups]
    does: Clean up, record the downstream counterpart, update the repository docs and your memory, release the claim.
    output: the follow-up report with counterpart and docs PR links
  - id: knowledge
    profile: agency-knowledge-manager
    skills: [post-merge-kb-update]
    does: Update the knowledge base and shared skills from the merged diff.
    output: knowledge and skills PRs, or "nothing to update" with the reason
  - id: close
    profile: agency-product-manager
    skills: [acceptance-criteria]
    needs: [followups, knowledge]
    does: Check the merged change against the acceptance criteria, link the follow-ups, and move the item to done.
    output: the work item closed, with every follow-up linked
done_when:
  - The work item is done and links the merge, the counterpart and every knowledge update.
