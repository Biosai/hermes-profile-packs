name: infra-change
version: 0.1.0
description: "Change infrastructure through review and a human apply"
summary: >-
  An infrastructure-as-code change from request to verified apply. The change is planned and
  reviewed in a PR; the merge and the apply stay with the humans the settings name.
pack: agency
coordinator: agency-infrastructure-engineer
trigger: >-
  An infrastructure change is requested: a work item, an incident follow-up, or drift found in a plan.
uses_settings: [delivery.iac_tool, delivery.merge_policy, delivery.apply_policy, owner.channel]
all_steps_load: [gated-delivery]
steps:
  - id: plan
    profile: agency-infrastructure-engineer
    skills: [iac-change-safety]
    does: Write the smallest change, read its plan for every environment, explain every replace and destroy, report drift.
    output: a PR with plan evidence and exact apply inputs
  - id: security
    profile: agency-infrastructure-engineer
    skills: [infra-security-review]
    needs: [plan]
    optional_when: the change touches identity, secrets, network exposure, WAF, CI or host bootstrap
    on_fail: plan
    does: Review the change for privilege, exposure and secret handling.
    output: findings resolved, or the blocking ones
  - id: gate
    profile: agency-product-manager
    skills: [ready-to-merge-gate]
    needs: [security]
    on_fail: plan
    does: Check every line of the ready-to-merge gate on the current head.
    output: a gate report where every line holds, or the failing lines
  - id: merge
    human: true
    decided_by: delivery.merge_policy
    needs: [gate]
    asks: merge the infrastructure PR, or say what blocks it
    does: The human or mechanism named by the merge policy merges the PR. You verify it is merged.
    output: the merge commit on the default branch
  - id: apply
    human: true
    decided_by: delivery.apply_policy
    needs: [merge]
    asks: apply the merged change with the inputs in the PR, then share the apply output
    does: The human or approved pipeline named by the apply policy applies. Nobody applies from a session.
    output: the apply output
  - id: verify
    profile: agency-infrastructure-engineer
    skills: [iac-change-safety]
    needs: [apply]
    does: Read the apply output and confirm that a fresh plan shows no changes.
    output: an empty fresh plan, or the failing resources with their errors
done_when:
  - A fresh plan after the apply shows no changes.
