name: issue-to-merge
version: 0.1.0
description: "Take a work item from shaping to a verified merge"
summary: >-
  One work item, from a shaped request to a merged change that a separate profile has verified with
  real runs. Shaping, building, verifying and gating are done by different profiles, and the merge
  stays with whoever delivery.merge_policy names.
pack: agency
coordinator: agency-product-manager
trigger: >-
  A work item is accepted for delivery: it is at the top of the ready queue, or the owner asks for it.
uses_settings: [delivery.code_host, delivery.repo_layout, delivery.issue_tracker, delivery.merge_policy, owner.channel]
all_steps_load: [gated-delivery]
steps:
  - id: shape
    profile: agency-product-manager
    skills: [issue-authoring-standard]
    does: Write or refine the work item so a developer can build it without guessing.
    output: a work item with problem, scope, acceptance criteria and links
  - id: clarify
    profile: agency-backend-engineer
    skills: [issue-clarification]
    needs: [shape]
    does: Ask every open question before any code, and record the answers on the work item.
    output: questions answered on the item, or an explicit "no open question"
  - id: build
    profile: agency-backend-engineer
    skills: [backend-service-implementation, backend-testing]
    extra_skills:
      - {skill: go-backend-craft, when: "the affected code is Go"}
    needs: [clarify]
    does: Implement the change with its tests in your own worktree and open a draft pull or merge request.
    output: a draft PR with tests and the run that proves them
  - id: verify
    profile: agency-qa-tester
    skills: [real-run-verification]
    needs: [build]
    on_fail: build
    does: Verify the change with runs you executed yourself, against a baseline at the head under test.
    output: PASS/SKIP/FAIL counts against the baseline, with the commands and the head SHA
  - id: readiness
    profile: agency-software-architect
    skills: [readiness-review, fresh-main-evidence]
    needs: [build]
    optional_when: the change moves a module boundary, a public contract or a data model
    on_fail: build
    does: Review whether the change fits the architecture, with evidence from the freshly fetched default branch.
    output: a readiness verdict with path:line@sha evidence
  - id: gate
    profile: agency-product-manager
    skills: [ready-to-merge-gate]
    needs: [verify, readiness]
    on_fail: build
    does: Check every line of the ready-to-merge gate on the current head.
    output: a gate report where every line holds, or the failing lines
  - id: merge
    human: true
    decided_by: delivery.merge_policy
    needs: [gate]
    asks: merge the PR named in the gate report, or say what blocks it
    does: The human or mechanism named by the merge policy merges the PR. You verify it is merged.
    output: the merge commit on the default branch
done_when:
  - The merged change meets the work item's acceptance criteria.
  - The verification counts and the gate report are linked from the work item.
then: [after-merge]
